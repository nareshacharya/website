<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">Make the action easy to review</title><desc id="desc">A proposed AI action passes through review and approval before execution; editing returns to review, and cancellation exits before execution.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8495A7"/></marker></defs><rect width="1000" height="650" fill="#FFFFFF"/><text x="40" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#172B4D">Make the action easy to review</text><text x="40" y="95" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#46576B">Preparation, permission, execution, and result are distinct states.</text><rect x="30" y="210" width="160" height="125" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="110.0" y="265.5" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Proposal</text><text x="110.0" y="295.5" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172B4D">Ready to review</text><rect x="225" y="210" width="160" height="125" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="305.0" y="265.5" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Review</text><text x="305.0" y="295.5" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172B4D">Content + target</text><rect x="420" y="210" width="160" height="125" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="500.0" y="265.5" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Approval</text><text x="500.0" y="295.5" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172B4D">This exact version</text><rect x="615" y="210" width="160" height="125" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="695.0" y="265.5" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Execute</text><text x="695.0" y="295.5" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172B4D">Action in progress</text><rect x="810" y="210" width="160" height="125" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="890.0" y="265.5" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Result</text><text x="890.0" y="295.5" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172B4D">Verified status</text><path d="M 190 272 L 220 272" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 385 272 L 415 272" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 580 272 L 610 272" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 775 272 L 805 272" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="180" y="435" width="150" height="80" rx="12" fill="#FFF1DC" stroke="#B5C8DD" stroke-width="1.5"/><text x="255.0" y="483.0" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Edit</text><rect x="360" y="435" width="150" height="80" rx="12" fill="#F1F5F9" stroke="#B5C8DD" stroke-width="1.5"/><text x="435.0" y="483.0" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Cancel</text><path d="M 305 339 L 305 390 L 255 390 L 255 430" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 175 475 L 15 475 L 15 165 L 305 165 L 305 205" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 305 390 L 435 390 L 435 430" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="705" y="455" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#172B4D">Approval stays tied</text><text x="705" y="490" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#172B4D">to the reviewed action</text></svg>