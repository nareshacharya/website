<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">Learn the work before drawing the screen</title><desc id="desc">A workflow from user goal to current work, decisions and exceptions, and a testable screen, with open questions feeding back into research.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8495A7"/></marker></defs><rect width="1000" height="650" fill="#FFFFFF"/><text x="40" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#172B4D">Learn the work before drawing the screen</text><text x="40" y="95" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#46576B">A small shared map gives the first design decision a clearer basis.</text><rect x="30" y="200" width="205" height="150" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="132.5" y="253.0" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">User goal</text><text x="132.5" y="283.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#172B4D">What needs</text><text x="132.5" y="313.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#172B4D">to happen?</text><rect x="275" y="200" width="205" height="150" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="377.5" y="253.0" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Current work</text><text x="377.5" y="283.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#172B4D">How is it</text><text x="377.5" y="313.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#172B4D">done today?</text><rect x="520" y="200" width="205" height="150" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="622.5" y="253.0" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Key decisions</text><text x="622.5" y="283.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#172B4D">Who decides?</text><text x="622.5" y="313.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#172B4D">What can fail?</text><rect x="765" y="200" width="205" height="150" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="867.5" y="253.0" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">First screen</text><text x="867.5" y="283.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#172B4D">Test the next</text><text x="867.5" y="313.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172B4D">design decision</text><path d="M 235 275 L 271 275" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 480 275 L 516 275" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 725 275 L 761 275" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 867 355 L 867 450 L 378 450 L 378 357" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="625" y="492" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#172B4D">Unanswered questions return to research</text></svg>