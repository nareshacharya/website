<title id="title">MAKE CONFLICTING RULES VISIBLE</title>
<desc id="desc">Claude Opus 5.5  /  Illustrative UX workflow. Three stages: Read the sources: Help page: 30 days, Email: 14 days, App: contact support; Expose the conflict: Link each claim to its source, Mark the unresolved decision, Draft the agreed parts; Decide and test: Policy owner resolves the rule, Designer reviews the flow, Customers try the return. A generated answer cannot decide which policy is correct.</desc>
