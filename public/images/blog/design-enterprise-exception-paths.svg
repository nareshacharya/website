<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">Match recovery to the kind of problem</title><desc id="desc">A blocked request branches into missing information, missing permission, and an uncertain result, with separate recovery actions for each.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8495A7"/></marker></defs><rect width="1000" height="650" fill="#FFFFFF"/><text x="40" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#172B4D">Match recovery to the kind of problem</text><text x="40" y="95" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#46576B">Each branch needs a truthful state and a supported next action.</text><rect x="35" y="275" width="215" height="120" rx="12" fill="#FFF1DC" stroke="#B5C8DD" stroke-width="1.5"/><text x="142.5" y="328.0" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Request blocked</text><text x="142.5" y="358.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#172B4D">What happened?</text><rect x="380" y="100" width="245" height="110" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="502.5" y="148.0" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Missing input</text><text x="502.5" y="178.0" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#172B4D">A field needs detail</text><rect x="710" y="100" width="250" height="110" rx="12" fill="#F1F5F9" stroke="#B5C8DD" stroke-width="1.5"/><text x="835.0" y="148.0" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Correct the input</text><text x="835.0" y="178.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#172B4D">Keep other work</text><path d="M 252 335 L 310 335 L 310 155 L 375 155" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 625 155 L 705 155" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="380" y="265" width="245" height="110" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="502.5" y="313.0" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Missing access</text><text x="502.5" y="343.0" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#172B4D">This role cannot act</text><rect x="710" y="265" width="250" height="110" rx="12" fill="#F1F5F9" stroke="#B5C8DD" stroke-width="1.5"/><text x="835.0" y="313.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#172B4D">Find the right role</text><text x="835.0" y="343.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#172B4D">Keep the request</text><path d="M 252 335 L 310 335 L 310 320 L 375 320" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 625 320 L 705 320" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="380" y="430" width="245" height="110" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="502.5" y="478.0" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Unknown result</text><text x="502.5" y="508.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#172B4D">No clear confirmation</text><rect x="710" y="430" width="250" height="110" rx="12" fill="#F1F5F9" stroke="#B5C8DD" stroke-width="1.5"/><text x="835.0" y="478.0" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Check the status</text><text x="835.0" y="508.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#172B4D">Avoid duplicates</text><path d="M 252 335 L 310 335 L 310 485 L 375 485" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 625 485 L 705 485" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/></svg>