<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">Test the whole experience</title><desc id="desc">A real user task is assessed for correctness, completion, understanding, control, recovery, and effort, with serious failures reviewed separately.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8495A7"/></marker></defs><rect width="1000" height="650" fill="#FFFFFF"/><text x="40" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#172B4D">Test the whole experience</text><text x="40" y="95" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#46576B">A correct answer is one part of completing a useful task.</text><rect x="370" y="270" width="260" height="90" rx="12" fill="#FFF1DC" stroke="#B5C8DD" stroke-width="1.5"/><text x="500.0" y="323.0" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Real user task</text><rect x="50" y="130" width="260" height="70" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="180.0" y="173.0" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Correctness</text><path d="M 180 200 L 500 264" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="370" y="130" width="260" height="70" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="500.0" y="173.0" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Completion</text><path d="M 500 200 L 500 264" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="690" y="130" width="260" height="70" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="820.0" y="173.0" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Understanding</text><path d="M 820 200 L 500 264" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="50" y="440" width="260" height="70" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="180.0" y="483.0" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Control</text><path d="M 500 365 L 180 435" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="370" y="440" width="260" height="70" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="500.0" y="483.0" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Recovery</text><path d="M 500 365 L 500 435" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="690" y="440" width="260" height="70" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="820.0" y="483.0" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Effort</text><path d="M 500 365 L 820 435" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="500" y="565" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle" fill="#172B4D">Release review: serious failures get a separate decision</text></svg>