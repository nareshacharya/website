<title id="title">FROM PICKUP RULES TO A CHECKABLE PROTOTYPE</title>
<desc id="desc">GPT-6.1 Sol  /  Illustrative UX workflow. Three stages: Give it clear rules: Bakery hours and pickup rules, A screenshot and fake orders, List what is still unknown; Build three states: Available pickup, Unavailable time, Sold-out item; Review with people: Check rules and keyboard use, Ask what actually passed, Observe a real customer. Keep publishing and payments behind human approval.</desc>
