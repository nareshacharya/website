<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">Carry the task across the handoff</title><desc id="desc">A handoff moves from AI-assisted work through a reviewed summary and waiting request to a person accepting responsibility.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8495A7"/></marker></defs><rect width="1000" height="650" fill="#FFFFFF"/><text x="40" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#172B4D">Carry the task across the handoff</text><text x="40" y="95" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#46576B">Give the receiving person enough context to continue.</text><rect x="30" y="210" width="205" height="195" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="132.5" y="300.5" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#172B4D">AI-assisted work</text><text x="132.5" y="330.5" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#172B4D">Goal still open</text><rect x="275" y="210" width="205" height="195" rx="12" fill="#FFF1DC" stroke="#B5C8DD" stroke-width="1.5"/><text x="377.5" y="270.5" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#172B4D">Reviewed summary</text><text x="377.5" y="300.5" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#172B4D">Goal and facts</text><text x="377.5" y="330.5" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172B4D">Attempts and results</text><text x="377.5" y="360.5" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#172B4D">Open question</text><rect x="520" y="210" width="205" height="195" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="622.5" y="285.5" font-family="Arial, sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#172B4D">Waiting request</text><text x="622.5" y="315.5" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#172B4D">Submitted</text><text x="622.5" y="345.5" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#172B4D">Not yet accepted</text><rect x="765" y="210" width="205" height="195" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="867.5" y="285.5" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Person accepts</text><text x="867.5" y="315.5" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#172B4D">Ownership is clear</text><text x="867.5" y="345.5" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#172B4D">Work continues</text><path d="M 235 305 L 271 305" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 480 305 L 516 305" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M 725 305 L 761 305" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="500" y="490" font-family="Arial, sans-serif" font-size="25" font-weight="600" text-anchor="middle" fill="#172B4D">A submitted request is not yet an accepted handoff</text><text x="500" y="529" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#46576B">Keep progress visible while responsibility changes</text></svg>