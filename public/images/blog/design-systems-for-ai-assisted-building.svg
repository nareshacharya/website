<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">Give the builder working design guidance</title><desc id="desc">Components, tokens, behaviour examples, and tests inform an AI-assisted interface build, which then passes through human and automated review.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8495A7"/></marker></defs><rect width="1000" height="650" fill="#FFFFFF"/><text x="40" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#172B4D">Give the builder working design guidance</text><text x="40" y="95" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#46576B">Examples and checks make the system easier to reuse.</text><rect x="35" y="135" width="210" height="105" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="140.0" y="180.5" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Components</text><text x="140.0" y="210.5" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172B4D">Approved building blocks</text><path d="M 140 245 L 140 280 L 500 280 L 500 310" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="275" y="135" width="210" height="105" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="380.0" y="180.5" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Tokens</text><text x="380.0" y="210.5" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172B4D">Shared design values</text><path d="M 380 245 L 380 280 L 500 280 L 500 310" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="515" y="135" width="210" height="105" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="620.0" y="180.5" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Examples</text><text x="620.0" y="210.5" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#172B4D">States and behaviour</text><path d="M 620 245 L 620 280 L 500 280 L 500 310" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="755" y="135" width="210" height="105" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="860.0" y="180.5" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Tests</text><text x="860.0" y="210.5" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#172B4D">Repeatable checks</text><path d="M 860 245 L 860 280 L 500 280 L 500 310" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="380" y="315" width="240" height="85" rx="12" fill="#FFF1DC" stroke="#B5C8DD" stroke-width="1.5"/><text x="500.0" y="365.5" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Clear task brief</text><path d="M 500 405 L 500 425 L 320 425 L 320 450" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="160" y="455" width="320" height="95" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="320.0" y="495.5" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">AI-assisted build</text><text x="320.0" y="525.5" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#172B4D">Use the existing system</text><path d="M 485 503 L 550 503" stroke="#8495A7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="555" y="455" width="300" height="95" rx="12" fill="#E9F2FF" stroke="#B5C8DD" stroke-width="1.5"/><text x="705.0" y="495.5" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#172B4D">Review the result</text><text x="705.0" y="525.5" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#172B4D">People + automated checks</text></svg>