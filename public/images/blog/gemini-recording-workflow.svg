<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img" aria-labelledby="title desc">
<title id="title">KEEP THE RECORDING CLOSE TO THE FINDING</title>
<desc id="desc">Gemini 3.8 Flash  /  Illustrative UX workflow. Three stages: Use approved material: Consent and data approval, Redacted screen recording, A focused research question; Locate candidate moments: Timestamp and visible action, Relevant spoken words, Uncertainty kept visible; Verify the evidence: Replay every cited moment, Check alternative explanations, Count misses and false flags. A pause is an observation. Confusion is an interpretation.</desc>
